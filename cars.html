<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>מרוץ מכוניות</title>
  <link rel="stylesheet" href="cars.css?v=1775406888">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏎️</text></svg>">
</head>
<body>
  <div id="game">
    <div class="game-hud">
      <a href="index.html" class="hud-back">&#8592;</a>
      <span class="hud-score">ניקוד: <span id="score">0</span></span>
      <span class="hud-best">שיא: <span id="best">0</span></span>
    </div>
    <canvas id="canvas"></canvas>
    <div class="game-overlay" id="overlay">
      <h2>🏎️ מרוץ מכוניות</h2>
      <p>התחמק ממכוניות ואסוף מטבעות</p>
      <button onclick="startGame()">התחל!</button>
    </div>
    <div class="mobile-controls" id="mobile-controls">
      <button class="mc-btn" id="mc-right">&#9654;</button>
      <button class="mc-btn" id="mc-left">&#9664;</button>
    </div>
  </div>
  <script src="cars.js?v=1775406888"></script>
  <script src="version-toast.js?v=1775406888"></script>
</body>
</html>
