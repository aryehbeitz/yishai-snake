</head>
<body>
  <div class="hub">
    <div class="header">
      <div class="user-section" id="user-section"></div>
      <button class="refresh-btn" onclick="location.reload()" title="רענון">&#8635;</button>
    </div>
    <h1 class="hub-title" id="hub-title"></h1>
    <p class="hub-subtitle">בחר משחק</p>
    <div class="hub-grid">

      <a href="snake.html" class="hub-card">
        <div class="hub-card-icon">🐍</div>
        <div class="hub-card-body">
          <h2>סנייק</h2>
          <p>קלאסי, מכשולים, צבעוני, רב-ממדי, AI</p>
        </div>
      </a>

      <a href="cars.html" class="hub-card">
        <div class="hub-card-icon">🏎️</div>
        <div class="hub-card-body">
          <h2>מרוץ מכוניות</h2>
          <p>התחמק ממכוניות ואסוף נקודות</p>
        </div>
      </a>

      <a href="smart-snake.html" class="hub-card">
        <div class="hub-card-icon"><svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><polygon points="12,30 12,42 21,37 21,25" fill="#3b82f6"/><polygon points="12,30 21,25 21,13 12,18" fill="#60a5fa"/><polygon points="21,25 30,30 30,18 21,13" fill="#2563eb"/><polygon points="21,37 30,42 30,30 21,25" fill="#1d4ed8"/><polygon points="30,30 39,25 39,13 30,18" fill="#3b82f6"/><polygon points="30,42 39,37 39,25 30,30" fill="#1e40af"/></svg></div>
        <div class="hub-card-body">
          <h2>סנייק חכם</h2>
          <p>סנייק עם בינה מלאכותית, 3 אלגוריתמי AI ומצב אוטומטי</p>
        </div>
      </a>

      <a href="dino.html" class="hub-card">
        <div class="hub-card-icon">🦕</div>
        <div class="hub-card-body">
          <h2>ג'יפ ודינוזאור</h2>
          <p>קפוץ מעל מכשולים — בחר דינוזאור או ג'יפ</p>
        </div>

      <div class="hub-card hub-card-soon">
        <div class="hub-card-icon">🧩</div>
        <div class="hub-card-body">

      </div>

    </div>
    <a href="changelog.html" class="hub-changelog-link">📋 שינויים וגרסאות</a>
  </div>
  <script src="version-toast.js?v=1778091970"></script>
  <script>
    // Login functionality for hub page
    let hubUser = localStorage.getItem('snakeUser') || '';

    function renderHubUser() {
      const sec = document.getElementById('user-section');
      const title = document.getElementById('hub-title');
      if (!hubUser) {
        sec.innerHTML = `
          <input id="hub-username-input" type="text" placeholder="הכנס שם..." maxlength="20">
          <button class="user-btn" onclick="loginHubUser()">כניסה</button>
        `;
        title.textContent = '';
        document.getElementById('hub-username-input').addEventListener('keydown', e => {
          if (e.key === 'Enter') loginHubUser();
        });
      } else {
        sec.innerHTML = `
          <div class="user-info">
            <span class="user-name">${hubUser}</span>
            <button class="user-logout" onclick="logoutHubUser()">יציאה</button>
          </div>
        `;
        title.textContent = hubUser;
      }
    }

    function loginHubUser() {
      const input = document.getElementById('hub-username-input');
      const name = (input.value || '').trim();
      if (!name) return;
      hubUser = name;
      localStorage.setItem('snakeUser', name);
      renderHubUser();
    }

    function logoutHubUser() {
      hubUser = '';
      localStorage.removeItem('snakeUser');
      renderHubUser();
    }

    // Initialize
    renderHubUser();
  </script>
</body>
</html>
