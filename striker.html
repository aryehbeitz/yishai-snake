const WORLD_W = 1600;

const cvs = document.getElementById("screen");
const ctx = cvs.getContext("2d");
ctx.imageSmoothingEnabled = true;
ctx.imageSmoothingQuality = "high";

// Match canvas internal resolution to its displayed pixel size for crisp output.
let renderScale = 1;
function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const rect = cvs.getBoundingClientRect();
  cvs.width  = Math.round(rect.width  * dpr);
  cvs.height = Math.round(rect.height * dpr);
  renderScale = cvs.height / H; // scale factor from logical to canvas pixels
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

// --- input ---
const keys = Object.create(null);
const pressed = Object.create(null);
window.addEventListener("keydown", e => {
  // Name entry intercepts most keys so we can capture text + edits cleanly.
  if (game && game.phase === "namentry") {
    if (e.key === "Enter") {
      pressed["enter"] = true; // not strictly needed but consistent
      submitName();
      e.preventDefault();
      return;
    }
    if (e.key === "Escape") {
      finishEntry();
      e.preventDefault();
      return;
    }
    if (e.key === "Backspace") {
      game.nameInput = game.nameInput.slice(0, -1);
      e.preventDefault();
      return;
    }
    if (e.key.length === 1 && game.nameInput.length < 16) {
      const c = sanitizeChar(e.key);
      if (c) {
        game.nameInput += c;
        e.preventDefault();
        return;
      }
    }
    // Allow non-character control keys to fall through (Tab, Shift, etc.)
  }

  const k = e.key.toLowerCase();
  if (!keys[k]) pressed[k] = true;
  keys[k] = true;
  if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
});
window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
function consume(k) { if (pressed[k]) { pressed[k] = false; return true; } return false; }

// --- rng ---
function makeRng(seed) {
  let s = seed >>> 0;
  return function() {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rng = makeRng(1);

function t(key) {
  const tbl = STR[game.lang] || STR.en;
  if (Array.isArray(tbl[key])) return tbl[key];
  return (tbl[key] != null) ? tbl[key] : (STR.en[key] != null ? STR.en[key] : key);
}
function tCount(key, n) { return t(key) + " (" + n + ")"; }

// --- audio ---
let audioCtx = null;
let muted = false;
function audio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { return null; }
  }
  return audioCtx;
}
function beep(freq, dur, type = "square", vol = 0.04) {
  if (muted) return;
  const a = audio();
  if (!a) return;
  const t = a.currentTime;
  const o = a.createOscillator();
  const g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.5), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination);
  o.start(t);
  o.stop(t + dur + 0.01);
}
function sfxGun()    { beep(880, 0.05, "square", 0.03); }
function sfxBomb()   { beep(200, 0.18, "sawtooth", 0.05); }
function sfxBoom()   { beep(110, 0.4, "sawtooth", 0.07); }
function sfxLaunch() { beep(330, 0.25, "triangle", 0.05); }
function sfxAlarm()  { beep(660, 0.08, "square", 0.05); setTimeout(() => beep(440, 0.08, "square", 0.05), 80); }
function sfxPickup() { beep(990, 0.06, "triangle", 0.05); setTimeout(() => beep(1320, 0.06, "triangle", 0.05), 60); }

// --- name input / leaderboard ---
const NAME_RE_OK = /[A-Za-z0-9֐-׿ \-']/;
function sanitizeChar(c) { return NAME_RE_OK.test(c) ? c : ""; }
function sanitizeName(s) {
  let out = "";
  if (!s) return out;
  for (const ch of s) if (NAME_RE_OK.test(ch)) out += ch;
  out = out.replace(/\s+/g, " ").trim();
  return out.slice(0, 16);
}

function fetchLeaderboard() {
  return fetch("/api/leaderboard?mode=striker&limit=10")
    .then(r => r.ok ? r.json() : [])
    .then(arr => { game.leaderboard = Array.isArray(arr) ? arr : []; })
    .catch(() => { game.leaderboard = game.leaderboard || []; });
}

function submitName() {
  const name = sanitizeName(game.nameInput);
  if (!name) { finishEntry(); return; }
  game.lastName = name;
  game.scoreSubmitted = true;
  game.posting = true;
  fetch("/api/scores", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ user: name, mode: "striker", score: game.score })
  })
    .then(r => r.ok ? r.json() : { newRecord: false })
    .then(d => { game.newRecord = !!d.newRecord; })
    .catch(() => {})
    .finally(() => {
      fetchLeaderboard().finally(() => {
        game.posting = false;
        finishEntry();
      });
    });
}

function finishEntry() {
  game.phase = game.victory ? "won" : "gameover";
}

function qualifiesForLeaderboard() {
  if (!game.leaderboard || game.leaderboard.length < 10) return true;
  return game.score > game.leaderboard[9].score;
}

function endGame(victory) {
  game.victory = victory;
  fetchLeaderboard(); // refresh in background regardless
  if (game.score > 0 && !game.scoreSubmitted && qualifiesForLeaderboard()) {
    game.phase = "namentry";
    game.nameInput = "";
  } else {
    game.phase = victory ? "won" : "gameover";
  }
}

// --- world ---
const terrain = new Int16Array(WORLD_W);
const ceiling = new Int16Array(WORLD_W);

function buildTerrain(seed) {
  const r = makeRng(seed);
  let y = 150;
  const top = 110, bot = 178;
  for (let i = 0; i < WORLD_W; i++) {
    y += (r() * 3 | 0) - 1;
    if (r() < 0.04) y += (r() * 7 | 0) - 3;
    if (y < top) y = top;
    if (y > bot) y = bot;
    terrain[i] = y;
  }
}

function buildCeiling(seed, enabled) {
  if (!enabled) {
    for (let i = 0; i < WORLD_W; i++) ceiling[i] = HUD_H - 1; // hidden above HUD
    return;
  }
  const r = makeRng(seed ^ 0xBEEF);
  let y = HUD_H + 10;
  const top = HUD_H + 4, bot = HUD_H + 28;
  for (let i = 0; i < WORLD_W; i++) {
    y += (r() * 3 | 0) - 1;
    if (r() < 0.05) y += (r() * 5 | 0) - 2;
    if (y < top) y = top;
    if (y > bot) y = bot;
    ceiling[i] = y;
  }
}

function ceilingAt(x) {
  let i = x | 0;
  if (i < 0) i = 0;
  if (i >= WORLD_W) i = WORLD_W - 1;
  return ceiling[i];
}

function floorAt(x) {
  let i = x | 0;
  if (i < 0) i = 0;
  if (i >= WORLD_W) i = WORLD_W - 1;
  return terrain[i];
}

// --- game state ---
const DIFFS = ["easy", "normal", "hard"];
function diffParams(d) {
  if (d === "easy")   return { spawn: 0.55, aaRate: 0.25, aaSpeed: 0.7, fuelBurn: 1.2 };
  if (d === "hard")   return { spawn: 1.65, aaRate: 0.85, aaSpeed: 1.25, fuelBurn: 2.0 };
  return                      { spawn: 1.0,  aaRate: 0.5,  aaSpeed: 1.0,  fuelBurn: 1.6 };
}

const game = {
  phase: "title",          // title | briefing | playing | paused | gameover | won
  difficulty: "normal",
  diffIdx: 1,
  paused: false,
  hasCeiling: false,
  lang: (localStorage.getItem("striker.lang") === "he") ? "he" : "en",
  titleView: "menu",       // menu | scores
  victory: false,
  nameInput: "",
  lastName: "",
  scoreSubmitted: false,
  posting: false,
  newRecord: false,
  leaderboard: null,
  mission: 1,
  score: 0,
  hi: parseInt(localStorage.getItem("striker.hi") || "0", 10) || 0,
  fuel: 100,
  ships: 3,
  cam: 0,
  heli: { x: 30, y: 60, vx: 0, vy: 0, dir: 1 },
  bullets: [],
  bombs: [],
  parts: [],
  foes: [],
  pads: [],
  carrying: 0,
  delivered: 0,
  target: 0,
  fireCd: 0,
  bombCd: 0,
  msg: null,
  msgT: 0,
  anim: 0,
};

function showMsg(s, t) { game.msg = s; game.msgT = t; }

function newMission(m) {
  game.mission = m;
  game.cam = 0;
  game.heli = { x: 30, y: 60, vx: 0, vy: 0, dir: 1 };
  game.bullets.length = 0;
  game.bombs.length = 0;
  game.parts.length = 0;
  game.foes.length = 0;
  game.pads.length = 0;
  game.carrying = 0;
  game.delivered = 0;
  game.fuel = 100;
  game.fireCd = 0;
  game.bombCd = 0;
  game.msg = null;
  game.msgT = 0;
  game.hasCeiling = (m === 3) || (m === 5);
  rng = makeRng(0xCAFE ^ (m * 2654435761));
  buildTerrain(0xC0FFEE ^ m);
  buildCeiling(0xC0FFEE ^ m, game.hasCeiling);

  const placements = [220, 440, 660, 880, 1100];
  if (m === 1) { game.target = 3; placements.slice(0, 3).forEach(x => game.pads.push({ k: "spy", x, alive: true })); }
  else if (m === 2) { game.target = 3; game.carrying = 3; placements.slice(0, 3).forEach(x => game.pads.push({ k: "drop", x, alive: true })); }
  else if (m === 3) { game.target = 3; placements.slice(0, 3).forEach(x => game.pads.push({ k: "cargo", x, alive: true })); }
  else if (m === 4) { game.target = 4; placements.slice(0, 4).forEach(x => game.pads.push({ k: "person", x, alive: true })); }
  else             { game.target = 1; game.pads.push({ k: "factory", x: 1380, alive: true }); }

  // Fuel canisters scattered
  for (let i = 0; i < 6; i++) game.pads.push({ k: "fuel", x: 140 + i * 220, alive: true });

  // Cyan radar dishes (bonus, destructible). 2-3 per mission.
  const radarCount = 2 + (m % 2);
  for (let i = 0; i < radarCount; i++) {
    const x = 320 + i * 350 + (rng() * 60 | 0);
    game.pads.push({ k: "radar", x, alive: true });
  }

  // Tanks
  const tankCount = 3 + m;
  for (let i = 0; i < tankCount; i++) {
    game.foes.push({
      k: "tank",
      x: 180 + i * 170 + (rng() * 30 | 0),
      y: 0, vx: 0, alive: true,
      cd: 1.5 + rng() * 3
    });
  }

  // Parked enemy helicopters (activate when player approaches)
  const ehCount = 1 + Math.floor(m / 2);
  for (let i = 0; i < ehCount; i++) {
    game.foes.push({
      k: "eheli",
      x: 380 + i * 380 + (rng() * 40 | 0),
      y: 0, vx: 0, vy: 0,
      state: "parked",
      alive: true
    });
  }

  game.phase = "briefing";
}

// --- collision helpers ---
function boom(x, y, n, color) {
  for (let i = 0; i < n; i++) {
    const a = rng() * Math.PI * 2;
    const s = 30 + rng() * 80;
    game.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.3 + rng() * 0.5, color });
  }
}

function die() {
  boom(game.heli.x, game.heli.y, 22, C_MAGENTA);
  game.ships--;
  if (game.ships < 0) { endGame(false); return; }
  game.heli.x = game.cam + 30;
  game.heli.y = 60;
  game.heli.vx = 0; game.heli.vy = 0;
  game.fuel = 100;
  game.bullets.length = 0;
  game.bombs.length = 0;
  showMsg(t("msg_down"), 2);
}

function update(dt) {
  game.anim++;

  // Title-screen difficulty select
  if (game.phase === "title") {
    if (consume("arrowleft") || consume("a")) game.diffIdx = (game.diffIdx + 2) % 3;
    if (consume("arrowright") || consume("d")) game.diffIdx = (game.diffIdx + 1) % 3;
    if (consume("arrowup") || consume("w")) game.diffIdx = (game.diffIdx + 2) % 3;
    if (consume("arrowdown") || consume("s")) game.diffIdx = (game.diffIdx + 1) % 3;
    if (consume("m")) muted = !muted;
    if (consume("l")) {
      game.lang = (game.lang === "he") ? "en" : "he";
      try { localStorage.setItem("striker.lang", game.lang); } catch (e) {}
    }
    if (consume("h")) {
      game.titleView = (game.titleView === "scores") ? "menu" : "scores";
      if (game.titleView === "scores") fetchLeaderboard();
    }
    if (consume("i")) {
      game.titleView = (game.titleView === "help") ? "menu" : "help";
    }
    if (consume("enter")) {
      if (game.titleView !== "menu") {
        // Any non-menu sub-view: Enter returns to the main menu.
        game.titleView = "menu";
      } else {
        game.difficulty = DIFFS[game.diffIdx];
        game.score = 0;
        game.ships = 3;
        newMission(1);
        sfxLaunch();
      }
    }
    return;
  }

  // Name entry blocks normal input — keystrokes handled in keydown listener.
  if (game.phase === "namentry") return;

  // Universal toggles
  if (consume("m")) muted = !muted;
  if (consume("l")) {
    game.lang = (game.lang === "he") ? "en" : "he";
    try { localStorage.setItem("striker.lang", game.lang); } catch (e) {}
  }
  if (consume("p") && (game.phase === "playing" || game.phase === "paused")) {
    game.phase = (game.phase === "playing") ? "paused" : "playing";
  }

  // In-game forfeit
  if (consume("q") && game.phase === "playing") { endGame(false); return; }

  // Phase transitions
  if (consume("enter") && game.phase === "briefing") { game.phase = "playing"; sfxLaunch(); }
  if (consume("r") && (game.phase === "gameover" || game.phase === "won")) {
    // Reset round state and bounce to title.
    game.scoreSubmitted = false;
    game.newRecord = false;
    game.nameInput = "";
    game.lastName = "";
    game.titleView = "menu";
    fetchLeaderboard();
    game.phase = "title";
    return;
  }

  if (game.phase !== "playing") return;

  const diff = diffParams(game.difficulty);
  const h = game.heli;
  let ax = 0, ay = 0;
  if (keys["arrowleft"]  || keys["a"]) { ax -= 1; h.dir = -1; }
  if (keys["arrowright"] || keys["d"]) { ax += 1; h.dir = 1; }
  if (keys["arrowup"]    || keys["w"]) ay -= 1;
  if (keys["arrowdown"]  || keys["s"]) ay += 1;

  // physics — units are pixels/sec
  h.vx = (h.vx + ax * 900 * dt) * Math.pow(0.05, dt);
  h.vy = (h.vy + ay * 700 * dt) * Math.pow(0.04, dt);
  h.vy += 50 * dt;
  h.x += h.vx * dt;
  h.y += h.vy * dt;
  if (h.x < 8) { h.x = 8; h.vx = 0; }
  if (h.x > WORLD_W - 8) { h.x = WORLD_W - 8; h.vx = 0; }
  if (h.y < HUD_H + 4) { h.y = HUD_H + 4; h.vy = 0; }

  game.fuel -= diff.fuelBurn * dt;
  if (game.fuel <= 0) { game.fuel = 0; die(); return; }

  const floor = floorAt(h.x);
  if (h.y >= floor - 4) {
    const soft = Math.abs(h.vx) < 30 && Math.abs(h.vy) < 50;
    if (soft) { h.y = floor - 4; h.vy = 0; }
    else { die(); return; }
  }
  // Ceiling collision
  if (game.hasCeiling) {
    const c = ceilingAt(h.x);
    if (h.y <= c + 4) { die(); return; }
  }

  // camera
  game.cam = Math.max(0, Math.min(WORLD_W - W, h.x - W / 2));

  // weapons
  game.fireCd -= dt;
  if (keys[" "] && game.fireCd <= 0) {
    game.fireCd = 0.18;
    game.bullets.push({ x: h.x + h.dir * 10, y: h.y, vx: h.dir * 360 });
    sfxGun();
  }
  game.bombCd -= dt;
  if (keys["x"] && game.bombCd <= 0) {
    game.bombCd = 0.4;
    game.bombs.push({ x: h.x, y: h.y + 4, vy: 30 });
    sfxBomb();
  }

  for (const b of game.bullets) b.x += b.vx * dt;
  for (const b of game.bombs) { b.vy += 110 * dt; b.y += b.vy * dt; }

  // Spawn jets / divers occasionally
  if (rng() < 0.7 * dt * diff.spawn) {
    const fromRight = rng() < 0.6;
    const x = fromRight ? game.cam + W + 20 : Math.max(20, game.cam - 20);
    const isDiver = rng() < 0.35;
    if (isDiver) {
      game.foes.push({
        k: "diver",
        x,
        y: HUD_H + 8,
        vx: fromRight ? -55 : 55,
        vy: 0,
        alive: true
      });
    } else {
      const gy = floorAt(x);
      const yMax = Math.max(HUD_H + 12, gy - 14);
      const yMin = HUD_H + 8;
      const y = yMin + rng() * Math.max(1, yMax - yMin);
      game.foes.push({ k: "jet", x, y, vx: fromRight ? -85 : 85, alive: true });
    }
  }

  // Foe AI
  for (const f of game.foes) {
    if (!f.alive) continue;

    if (f.k === "jet") {
      f.x += f.vx * dt;
      const g = floorAt(f.x);
      if (f.y > g - 8) f.y = g - 8;
      if (f.y < HUD_H + 4) f.y = HUD_H + 4;

    } else if (f.k === "diver") {
      // Swoop toward heli's x then dive
      f.x += f.vx * dt;
      const dx = h.x - f.x;
      f.vx += Math.sign(dx) * 40 * dt;
      f.vy += (h.y - f.y) * 0.6 * dt;
      f.vy = Math.max(-120, Math.min(120, f.vy));
      f.y += f.vy * dt;
      const g = floorAt(f.x);
      if (f.y > g - 8) { f.alive = false; boom(f.x, g - 4, 10, C_MAGENTA); sfxBoom(); }
      if (f.y < HUD_H + 2) f.y = HUD_H + 2;

    } else if (f.k === "tank") {
      // Periodic AA missile launch
      f.cd -= dt;
      const onScreen = f.x > game.cam - 10 && f.x < game.cam + W + 10;
      const inRange = Math.abs(f.x - h.x) < 180;
      if (f.cd <= 0 && onScreen && inRange) {
        f.cd = (2.0 + rng() * 3.0) / diff.aaRate;
        const fy = floorAt(f.x) - 8;
        game.foes.push({
          k: "rocket",
          x: f.x,
          y: fy,
          vx: 0,
          vy: -40 * diff.aaSpeed,
          alive: true,
          fuse: 5.0
        });
        sfxLaunch();
      }

    } else if (f.k === "rocket") {
      // Accelerate up, mild horizontal homing toward heli x
      f.vy -= 110 * diff.aaSpeed * dt;
      f.vy = Math.max(-220 * diff.aaSpeed, f.vy);
      f.vx += Math.sign(h.x - f.x) * 35 * dt;
      f.vx = Math.max(-50, Math.min(50, f.vx));
      f.x += f.vx * dt;
      f.y += f.vy * dt;
      f.fuse -= dt;
      if (f.fuse <= 0 || f.y < HUD_H + 2) {
        f.alive = false;
        boom(f.x, f.y, 6, C_MAGENTA);
      }
      if (game.hasCeiling && f.y < ceilingAt(f.x) + 2) {
        f.alive = false;
        boom(f.x, f.y, 6, C_MAGENTA);
      }

    } else if (f.k === "eheli") {
      const gy = floorAt(f.x);
      if (f.state === "parked") {
        // Sit on ground, take off when player is near
        f.y = gy - 4;
        if (Math.abs(f.x - h.x) < 130 && h.x !== undefined) {
          f.state = "active";
          f.vy = -30;
          sfxAlarm();
          showMsg(t("msg_bogey"), 1.5);
        }
      } else {
        // Active: pursue heli
        const dx = h.x - f.x;
        const dy = h.y - f.y;
        f.vx += Math.sign(dx) * 25 * dt;
        f.vx = Math.max(-60, Math.min(60, f.vx)) * Math.pow(0.3, dt);
        f.vy += Math.sign(dy) * 18 * dt + 5 * dt;
        f.vy = Math.max(-70, Math.min(60, f.vy)) * Math.pow(0.3, dt);
        f.x += f.vx * dt;
        f.y += f.vy * dt;
        if (f.y > gy - 6) { f.y = gy - 6; f.vy = -10; }
        if (f.y < HUD_H + 4) { f.y = HUD_H + 4; f.vy = 0; }
        // Active enemy choppers also fire AA at low rate
        f.cd = (f.cd || 2 + rng() * 2) - dt;
        if (f.cd <= 0 && Math.abs(f.x - h.x) < 200) {
          f.cd = (3 + rng() * 2) / diff.aaRate;
          game.foes.push({
            k: "rocket",
            x: f.x,
            y: f.y + 2,
            vx: Math.sign(h.x - f.x) * 30,
            vy: -50 * diff.aaSpeed,
            alive: true,
            fuse: 4.0
          });
          sfxLaunch();
        }
      }
    }
  }

  // Cull off-screen flying foes (tanks/parked helis are world-anchored)
  game.foes = game.foes.filter(f => {
    if (!f.alive) return false;
    if (f.k === "tank" || f.k === "eheli") return true;
    return f.x > game.cam - 60 && f.x < game.cam + W + 60 && f.y > HUD_H - 20 && f.y < H + 20;
  });

  // bullets vs foes / radar dishes / terrain
  for (const b of game.bullets) {
    if (b.x < 0 || b.x > WORLD_W) { b.dead = true; continue; }
    if (b.y >= floorAt(b.x)) { b.dead = true; continue; }
    if (game.hasCeiling && b.y <= ceilingAt(b.x)) { b.dead = true; continue; }
    for (const f of game.foes) {
      if (!f.alive) continue;
      const fy = (f.k === "tank" || (f.k === "eheli" && f.state === "parked"))
        ? floorAt(f.x) - 6
        : f.y;
      let dxLim, dyLim;
      if (f.k === "jet" || f.k === "diver") { dxLim = 12; dyLim = 7; }
      else if (f.k === "rocket") { dxLim = 5; dyLim = 6; }
      else if (f.k === "eheli")  { dxLim = 12; dyLim = 7; }
      else { dxLim = 9; dyLim = 6; }
      if (Math.abs(f.x - b.x) < dxLim && Math.abs(fy - b.y) < dyLim) {
        f.alive = false;
        b.dead = true;
        const pts = f.k === "eheli" ? 300 : (f.k === "rocket" ? 50 : (f.k === "diver" ? 150 : 100));
        game.score += pts;
        boom(f.x, fy, 10, C_MAGENTA);
        sfxBoom();
        break;
      }
    }
    if (b.dead) continue;
    // Bullets can pop radar dishes too
    for (const p of game.pads) {
      if (!p.alive || p.k !== "radar") continue;
      const fy = floorAt(p.x) - 10;
      if (Math.abs(p.x - b.x) < 7 && Math.abs(fy - b.y) < 8) {
        p.alive = false;
        b.dead = true;
        game.score += 1000;
        boom(p.x, fy, 18, C_CYAN);
        sfxBoom();
        showMsg(t("msg_radar"), 1.5);
        break;
      }
    }
  }
  game.bullets = game.bullets.filter(b => !b.dead);

  // bombs vs foes / radar / factory / terrain
  for (const b of game.bombs) {
    if (b.dead) continue;
    for (const f of game.foes) {
      if (!f.alive) continue;
      const fy = (f.k === "tank" || (f.k === "eheli" && f.state === "parked"))
        ? floorAt(f.x) - 6
        : f.y;
      let dxLim, dyLim;
      if (f.k === "jet" || f.k === "diver") { dxLim = 12; dyLim = 7; }
      else if (f.k === "rocket") { dxLim = 6; dyLim = 6; }
      else if (f.k === "eheli")  { dxLim = 18; dyLim = 12; } // generous — sprite is multi-cell
      else if (f.k === "tank")   { dxLim = 16; dyLim = 14; } // ditto
      else { dxLim = 10; dyLim = 8; }
      if (Math.abs(f.x - b.x) < dxLim && Math.abs(fy - b.y) < dyLim) {
        f.alive = false;
        const pts =
          f.k === "eheli"  ? 400 :
          f.k === "diver"  ? 250 :
          f.k === "jet"    ? 200 :
          f.k === "rocket" ? 75 : 150;
        game.score += pts;
        boom(f.x, fy, 14, C_MAGENTA);
        sfxBoom();
        b.dead = true;
        break;
      }
    }
    if (b.dead) continue;
    // Hit radar dish
    for (const p of game.pads) {
      if (!p.alive || p.k !== "radar") continue;
      const fy = floorAt(p.x) - 10;
      if (Math.abs(p.x - b.x) < 8 && Math.abs(fy - b.y) < 10) {
        p.alive = false;
        game.score += 1000;
        boom(p.x, fy, 20, C_CYAN);
        sfxBoom();
        showMsg(t("msg_radar"), 1.5);
        b.dead = true;
        break;
      }
    }
    if (b.dead) continue;
    // Hit factory silhouette directly
    for (const p of game.pads) {
      if (!p.alive || p.k !== "factory") continue;
      const fy = floorAt(p.x);
      if (Math.abs(p.x - b.x) < 18 && b.y > fy - 34 && b.y < fy + 2) {
        p.alive = false;
        game.delivered++;
        game.score += 5000;
        boom(p.x, fy - 12, 30, C_MAGENTA);
        sfxBoom();
        showMsg(t("msg_factory"), 3);
        b.dead = true;
        break;
      }
    }
    if (b.dead) continue;
    // Hit the ground — splash damage to nearby ground foes (tanks + parked helis)
    if (b.y >= floorAt(b.x) - 1) {
      boom(b.x, b.y, 16, C_MAGENTA);
      sfxBoom();
      for (const f of game.foes) {
        if (!f.alive) continue;
        const ground = (f.k === "tank") ||
                       (f.k === "eheli" && f.state === "parked");
        if (!ground) continue;
        if (Math.abs(f.x - b.x) < 20) {
          f.alive = false;
          const pts = f.k === "eheli" ? 400 : 150;
          game.score += pts;
          boom(f.x, floorAt(f.x) - 6, 12, C_MAGENTA);
        }
      }
      b.dead = true;
    }
  }
  game.bombs = game.bombs.filter(b => !b.dead && b.y < H + 10);

  // Deadly foe contact with heli
  for (const f of game.foes) {
    if (!f.alive) continue;
    if (f.k === "tank" || (f.k === "eheli" && f.state === "parked")) continue;
    let dxLim, dyLim;
    if (f.k === "rocket") { dxLim = 5; dyLim = 5; }
    else if (f.k === "eheli") { dxLim = 12; dyLim = 6; }
    else { dxLim = 10; dyLim = 5; }
    if (Math.abs(f.x - h.x) < dxLim && Math.abs(f.y - h.y) < dyLim) {
      // Take out the contacting foe in the explosion too
      f.alive = false;
      die();
      return;
    }
  }

  // pad interactions
  const onFloor = h.y >= floor - 6;
  const slow = Math.abs(h.vx) < 25 && Math.abs(h.vy) < 35;
  for (const p of game.pads) {
    if (!p.alive) continue;
    if (Math.abs(p.x - h.x) > 14) continue;
    if (p.k === "fuel" && onFloor) {
      game.fuel = Math.min(100, game.fuel + 60 * dt);
      if (game.fuel >= 100) { p.alive = false; game.score += 50; }
    } else if (p.k === "spy" && onFloor && slow && game.mission === 1) {
      p.alive = false; game.carrying++; showMsg(tCount("msg_op_aboard", game.carrying), 2);
      sfxPickup();
    } else if (p.k === "cargo" && onFloor && slow && game.mission === 3) {
      p.alive = false; game.carrying++; showMsg(tCount("msg_cargo", game.carrying), 2);
      sfxPickup();
    } else if (p.k === "person" && onFloor && slow && game.mission === 4) {
      p.alive = false; game.carrying++; showMsg(tCount("msg_evac", game.carrying), 2);
      sfxPickup();
    } else if (p.k === "drop" && onFloor && slow && game.mission === 2 && game.carrying > 0) {
      p.alive = false; game.carrying--; game.delivered++; game.score += 500;
      showMsg(t("msg_op_drop"), 2);
      sfxPickup();
    }
  }

  // return to base (left edge)
  // Base is the left edge. Don't require slow landing — just touch the ground there.
  if (h.x < 40 && onFloor && game.carrying > 0 && (game.mission === 1 || game.mission === 3 || game.mission === 4)) {
    const delivered = game.carrying;
    game.delivered += delivered;
    game.score += 500 * delivered;
    showMsg(t("msg_delivered") + " " + delivered + " " + t("msg_to_base"), 2);
    game.carrying = 0;
    sfxPickup();
  }

  // mission complete
  const done = game.mission === 5 ? game.delivered >= 1 : game.delivered >= game.target;
  if (done) {
    game.score += 1000 * game.mission;
    if (game.mission >= 5) { endGame(true); return; }
    else { newMission(game.mission + 1); }
  }
  if (game.score > game.hi) {
    game.hi = game.score;
    try { localStorage.setItem("striker.hi", String(game.hi)); } catch (e) {}
  }

  // particles
  for (const p of game.parts) {
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 60 * dt;
    p.life -= dt;
  }
  game.parts = game.parts.filter(p => p.life > 0);

  if (game.msgT > 0) { game.msgT -= dt; if (game.msgT <= 0) game.msg = null; }
}

// --- drawing ---

function setFont(size) { ctx.font = "bold " + size + "px monospace"; }
function pad(n, len) { return String(n).padStart(len, "0"); }

function drawHud() {
  ctx.fillStyle = C_BLACK;
  ctx.fillRect(0, 0, W, HUD_H);

  setFont(7);
  ctx.textBaseline = "top";
  ctx.textAlign = "left";
  ctx.fillStyle = C_MAGENTA;
  ctx.fillText(t("hud_score") + ":" + pad(game.score, 6), 2, 1);
  ctx.fillText(t("hud_mission") + ":" + game.mission, 110, 1);
  ctx.fillText(t("hud_ships") + ":", 168, 1);
  for (let i = 0; i < game.ships; i++) drawShipIcon(202 + i * 14, 2);

  ctx.fillStyle = C_MAGENTA;
  ctx.fillText(t("hud_fuel") + ":", 2, 9);
  const barX = 26, barY = 10, barW = 140, barH = 5;
  ctx.strokeStyle = C_MAGENTA;
  ctx.strokeRect(barX - 0.5, barY - 0.5, barW + 1, barH + 1);
  ctx.fillStyle = C_MAGENTA;
  ctx.fillRect(barX, barY, Math.round(barW * game.fuel / 100), barH);

  ctx.fillStyle = C_CYAN;
  ctx.fillText(t("hud_hi") + ":" + pad(game.hi, 6), 246, 9);

  // Difficulty + mute mini-indicator on bottom row, between fuel bar and HI
  setFont(6);
  ctx.fillStyle = C_CYAN;
  ctx.fillText(game.difficulty.toUpperCase(), 175, 10);
  if (muted) {
    ctx.fillStyle = C_MAGENTA;
    ctx.fillText("M", 220, 10);
  }
  setFont(7);
}

function drawShipIcon(x, y) {
  // mini-helicopter icon — same vibe as in-game sprite
  ctx.fillStyle = C_WHITE;
  ctx.fillRect(x, y, 12, 1);          // rotor
  ctx.fillRect(x + 5, y + 1, 1, 1);   // mast
  ctx.fillRect(x + 2, y + 2, 9, 2);   // body
  ctx.fillStyle = C_MAGENTA;
  ctx.fillRect(x + 11, y + 2, 1, 1);  // nose
  ctx.fillStyle = C_WHITE;
  ctx.fillRect(x, y + 3, 2, 1);       // tail
}

function drawTerrain(cam) {
  ctx.strokeStyle = C_WHITE;
  ctx.lineWidth = 0.6;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.beginPath();
  for (let sx = 0; sx <= W; sx++) {
    const wx = sx + cam;
    if (wx < 0 || wx >= WORLD_W) continue;
    const y = terrain[wx];
    if (sx === 0) ctx.moveTo(sx, y);
    else ctx.lineTo(sx, y);
  }
  ctx.stroke();
}

function drawBase(cam) {
  // Only on missions where you return to base
  if (![1, 3, 4].includes(game.mission)) return;
  const wx = 12;
  const sx = wx - cam;
  if (sx < -20 || sx > 60) return;
  const fy = terrain[Math.max(0, Math.min(WORLD_W - 1, wx))];
  // pole
  ctx.fillStyle = C_CYAN;
  ctx.fillRect(sx, fy - 14, 1, 14);
  // flag — animated waving width
  const wave = (game.anim % 20) < 10 ? 6 : 7;
  ctx.fillRect(sx + 1, fy - 13, wave, 4);
  // tiny ground pad strip
  ctx.fillRect(sx - 8, fy - 1, 16, 1);
  // "B" letter
  setFont(6);
  ctx.fillStyle = C_BLACK;
  ctx.textAlign = "center";
  ctx.fillText("B", sx + 4, fy - 9);
  setFont(7);
}

function drawCeiling(cam) {
  if (!game.hasCeiling) return;
  ctx.strokeStyle = C_WHITE;
  ctx.lineWidth = 0.6;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.beginPath();
  for (let sx = 0; sx <= W; sx++) {
    const wx = sx + cam;
    if (wx < 0 || wx >= WORLD_W) continue;
    const y = ceiling[wx];
    if (sx === 0) ctx.moveTo(sx, y);
    else ctx.lineTo(sx, y);
  }
  ctx.stroke();
}

function drawHeli(x, y, dir) {
  ctx.save();
  ctx.translate(x, y);
  if (dir < 0) ctx.scale(-1, 1);

  ctx.fillStyle = C_WHITE;
  // rotor — long horizontal bar, animated
  if (game.anim % 4 < 2) {
    ctx.fillRect(-12, -6, 24, 1);
  } else {
    for (let i = -12; i < 12; i += 3) ctx.fillRect(i, -6, 2, 1);
  }
  // mast
  ctx.fillRect(0, -5, 1, 2);
  // cabin top arch
  ctx.fillRect(-4, -3, 12, 1);
  // body lower edge
  ctx.fillRect(-8, 1, 16, 1);
  // body sides
  ctx.fillRect(-8, -2, 1, 3);
  ctx.fillRect( 7, -2, 1, 3);
  // cockpit window vertical edge
  ctx.fillRect(4, -2, 1, 3);
  // tail boom
  ctx.fillRect(-15, -1, 8, 1);
  // tail vertical fin
  ctx.fillRect(-15, -3, 1, 3);
  // tail rotor blade
  ctx.fillRect(-16, -2, 1, 1);
  ctx.fillRect(-16,  0, 1, 1);
  // skids
  ctx.fillRect(-7, 3, 14, 1);
  ctx.fillRect(-5, 2, 1, 1);
  ctx.fillRect( 4, 2, 1, 1);
  // magenta nose dot
  ctx.fillStyle = C_MAGENTA;
  ctx.fillRect(7, -1, 2, 2);

  ctx.restore();
}

function drawTank(x, fy) {
  ctx.fillStyle = C_MAGENTA;
  ctx.fillRect(x - 1, fy - 9, 6, 1);   // barrel
  ctx.fillRect(x - 3, fy - 8, 7, 3);   // turret
  ctx.fillRect(x - 6, fy - 5, 12, 3);  // body
  ctx.fillRect(x - 6, fy - 2, 12, 1);  // track top
  for (let i = 0; i < 5; i++) ctx.fillRect(x - 6 + i * 3, fy - 1, 2, 1);
}

function drawRadar(x, fy) {
  ctx.fillStyle = C_CYAN;
  // base
  ctx.fillRect(x - 4, fy - 1, 9, 1);
  // post
  ctx.fillRect(x, fy - 7, 1, 6);
  // dish — outlined arc
  ctx.strokeStyle = C_CYAN;
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.arc(x, fy - 9, 4, Math.PI * 1.15, Math.PI * 1.85);
  ctx.stroke();
  // feed dot
  ctx.fillRect(x, fy - 10, 1, 1);
}

function drawEheli(x, y, dir, parked) {
  // Same general shape as the player heli, but rendered entirely in magenta
  ctx.save();
  ctx.translate(x, y);
  if (dir < 0) ctx.scale(-1, 1);
  ctx.fillStyle = C_MAGENTA;
  // rotor — only spins when active
  if (!parked) {
    if (game.anim % 4 < 2) ctx.fillRect(-10, -5, 20, 1);
    else for (let i = -10; i < 10; i += 3) ctx.fillRect(i, -5, 2, 1);
  } else {
    ctx.fillRect(-9, -5, 18, 1); // resting blade
  }
  // mast
  ctx.fillRect(0, -4, 1, 2);
  // cabin
  ctx.fillRect(-3, -3, 9, 1);
  // body
  ctx.fillRect(-6, 1, 12, 1);
  ctx.fillRect(-6, -2, 1, 3);
  ctx.fillRect( 6, -2, 1, 3);
  // tail
  ctx.fillRect(-12, -1, 6, 1);
  ctx.fillRect(-12, -3, 1, 3);
  // skids
  ctx.fillRect(-6, 3, 12, 1);
  ctx.restore();
}

function drawRocket(x, y) {
  // pointed upward
  ctx.fillStyle = C_MAGENTA;
  ctx.fillRect(x, y - 4, 1, 4);          // body
  ctx.fillRect(x - 1, y - 3, 1, 1);      // fin L
  ctx.fillRect(x + 1, y - 3, 1, 1);      // fin R
  ctx.fillRect(x, y - 5, 1, 1);          // nose tip
  // exhaust trail
  ctx.fillStyle = C_WHITE;
  ctx.fillRect(x, y, 1, 2);
  if (game.anim % 4 < 2) ctx.fillRect(x - 1, y + 1, 3, 1);
}

function drawDiver(x, y, right) {
  // wing-down silhouette
  ctx.fillStyle = C_MAGENTA;
  if (right) {
    ctx.fillRect(x - 6, y, 12, 2);
    ctx.fillRect(x - 4, y + 1, 4, 2);
    ctx.fillRect(x + 6, y - 1, 1, 1);
  } else {
    ctx.fillRect(x - 6, y, 12, 2);
    ctx.fillRect(x,     y + 1, 4, 2);
    ctx.fillRect(x - 7, y - 1, 1, 1);
  }
}

function drawSpy(x, fy) {
  // a plus-shaped rosette
  ctx.fillStyle = C_MAGENTA;
  ctx.fillRect(x - 1, fy - 6, 3, 1);
  ctx.fillRect(x - 3, fy - 5, 7, 1);
  ctx.fillRect(x - 4, fy - 4, 9, 1);
  ctx.fillRect(x - 3, fy - 3, 7, 1);
  ctx.fillRect(x - 1, fy - 2, 3, 1);
  ctx.fillStyle = C_BLACK;
  ctx.fillRect(x, fy - 4, 1, 1);
}

function drawCargo(x, fy) {
  ctx.strokeStyle = C_MAGENTA;
  ctx.lineWidth = 1;
  ctx.strokeRect(x - 4 + 0.5, fy - 8 + 0.5, 8, 7);
  ctx.beginPath();
  ctx.moveTo(x - 4, fy - 5); ctx.lineTo(x + 4, fy - 5);
  ctx.moveTo(x, fy - 8);     ctx.lineTo(x, fy - 1);
  ctx.stroke();
}

function drawPerson(x, fy) {
  ctx.fillStyle = C_WHITE;
  // head
  ctx.fillRect(x - 1, fy - 8, 2, 2);
  // body
  ctx.fillRect(x, fy - 6, 1, 4);
  // arms waving
  if (game.anim % 24 < 12) {
    ctx.fillRect(x - 2, fy - 7, 1, 1);
    ctx.fillRect(x + 1, fy - 4, 1, 1);
  } else {
    ctx.fillRect(x - 2, fy - 4, 1, 1);
    ctx.fillRect(x + 1, fy - 7, 1, 1);
  }
  // legs
  ctx.fillRect(x - 1, fy - 2, 1, 2);
  ctx.fillRect(x + 1, fy - 2, 1, 2);
}

function drawDrop(x, fy) {
  ctx.strokeStyle = C_MAGENTA;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x - 4, fy - 7); ctx.lineTo(x + 4, fy - 1);
  ctx.moveTo(x + 4, fy - 7); ctx.lineTo(x - 4, fy - 1);
  ctx.stroke();
}

function drawFuel(x, fy) {
  ctx.fillStyle = C_CYAN;
  ctx.fillRect(x - 3, fy - 8, 6, 7);
  ctx.fillStyle = C_BLACK;
  ctx.fillRect(x - 2, fy - 6, 4, 1);
  ctx.fillRect(x - 2, fy - 4, 4, 1);
  ctx.fillStyle = C_CYAN;
  ctx.fillRect(x - 1, fy - 10, 2, 2);
}

function drawFactory(x, fy) {
  ctx.fillStyle = C_MAGENTA;
  // smokestack
  ctx.fillRect(x - 1, fy - 32, 3, 8);
  ctx.fillRect(x - 2, fy - 24, 5, 1);
  // roof line
  ctx.fillRect(x - 12, fy - 23, 26, 2);
  // walls
  ctx.fillRect(x - 14, fy - 21, 30, 19);
  // windows (cut-outs)
  ctx.fillStyle = C_BLACK;
  for (let row = 0; row < 2; row++) {
    for (let col = 0; col < 5; col++) {
      ctx.fillRect(x - 12 + col * 5, fy - 18 + row * 7, 3, 4);
    }
  }
  // smoke puffs
  ctx.fillStyle = C_WHITE;
  const t = (game.anim / 6) | 0;
  for (let i = 0; i < 4; i++) {
    const ox = ((t + i * 2) % 5) - 2;
    ctx.fillRect(x + ox, fy - 34 - i * 3, 2, 1);
  }
}

function drawJet(x, y, right) {
  ctx.fillStyle = C_MAGENTA;
  ctx.fillRect(x - 7, y, 14, 2);          // fuselage
  if (right) {
    ctx.fillRect(x - 2, y - 2, 6, 1);     // back wing
    ctx.fillRect(x - 5, y + 2, 4, 1);     // tail
    ctx.fillRect(x + 6, y - 1, 1, 1);     // nose tip
  } else {
    ctx.fillRect(x - 4, y - 2, 6, 1);
    ctx.fillRect(x + 1, y + 2, 4, 1);
    ctx.fillRect(x - 7, y - 1, 1, 1);
  }
}

function drawCenterText(lines, color) {
  setFont(8);
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = color;
  const cy = HUD_H + (H - HUD_H) / 2;
  const total = lines.length * 12;
  for (let i = 0; i < lines.length; i++) {
    ctx.fillText(lines[i], W / 2, cy - total / 2 + i * 12);
  }
}

function missionTitle(m) {
  const arr = t("titles");
  return arr[m - 1];
}

function draw() {
  // Reset transform and scale logical -> canvas pixels each frame
  ctx.setTransform(renderScale, 0, 0, renderScale, 0, 0);

  // background
  ctx.fillStyle = C_BLACK;
  ctx.fillRect(0, 0, W, H);

  // play area clip
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, HUD_H, W, H - HUD_H);
  ctx.clip();

  const cam = Math.round(game.cam);

  // Title screen gets a clean black backdrop — no terrain peeking through menus.
  const renderWorld = game.phase !== "title";

  if (renderWorld) {
  drawTerrain(cam);
  drawCeiling(cam);
  drawBase(cam);

  // pads
  for (const p of game.pads) {
    if (!p.alive) continue;
    const sx = Math.round(p.x - cam);
    if (sx < -40 || sx > W + 40) continue;
    const fy = terrain[Math.max(0, Math.min(WORLD_W - 1, Math.floor(p.x)))];
    if (p.k === "fuel")    drawFuel(sx, fy);
    else if (p.k === "spy")     drawSpy(sx, fy);
    else if (p.k === "cargo")   drawCargo(sx, fy);
    else if (p.k === "person")  drawPerson(sx, fy);
    else if (p.k === "drop")    drawDrop(sx, fy);
    else if (p.k === "factory") drawFactory(sx, fy);
    else if (p.k === "radar")   drawRadar(sx, fy);
  }

  // foes
  for (const f of game.foes) {
    if (!f.alive) continue;
    const sx = Math.round(f.x - cam);
    if (f.k === "tank") {
      const fy = terrain[Math.max(0, Math.min(WORLD_W - 1, Math.floor(f.x)))];
      drawTank(sx, fy);
    } else if (f.k === "jet") {
      drawJet(sx, Math.round(f.y), f.vx > 0);
    } else if (f.k === "diver") {
      drawDiver(sx, Math.round(f.y), f.vx > 0);
    } else if (f.k === "rocket") {
      drawRocket(sx, Math.round(f.y));
    } else if (f.k === "eheli") {
      const dir = f.vx >= 0 ? 1 : -1;
      const yPos = f.state === "parked"
        ? terrain[Math.max(0, Math.min(WORLD_W - 1, Math.floor(f.x)))] - 4
        : Math.round(f.y);
      drawEheli(sx, yPos, dir, f.state === "parked");
    }
  }

  // bullets
  ctx.fillStyle = C_WHITE;
  for (const b of game.bullets) {
    const sx = Math.round(b.x - cam);
    const sy = Math.round(b.y);
    ctx.fillRect(sx - (b.vx > 0 ? 3 : 0), sy, 4, 1);
  }

  // bombs
  for (const b of game.bombs) {
    const sx = Math.round(b.x - cam);
    const sy = Math.round(b.y);
    ctx.fillStyle = C_WHITE;
    ctx.fillRect(sx - 1, sy - 1, 3, 3);
    ctx.fillRect(sx, sy - 5, 1, 3);
  }

  // particles
  for (const p of game.parts) {
    ctx.fillStyle = p.color;
    ctx.fillRect(Math.round(p.x - cam), Math.round(p.y), 1, 1);
  }

  // helicopter
  drawHeli(Math.round(game.heli.x - cam), Math.round(game.heli.y), game.heli.dir);
  } // end if (renderWorld)

  ctx.restore();

  // HUD on top
  drawHud();

  // overlays
  if (game.phase === "title") {
    drawTitleScreen();
  } else if (game.phase === "briefing") {
    drawCenterText([
      t("mission_word") + " " + t("ordinals")[game.mission - 1],
      missionTitle(game.mission),
      game.hasCeiling ? t("tunnel") : "",
      "",
      t("controls_1"),
      t("controls_2"),
      "",
      t("press_enter")
    ], C_WHITE);
  } else if (game.phase === "paused") {
    drawCenterText([
      t("paused"),
      "",
      t("resume_help")
    ], C_CYAN);
  } else if (game.phase === "namentry") {
    drawNameEntry();
  } else if (game.phase === "gameover") {
    drawEndScreen(false);
  } else if (game.phase === "won") {
    drawEndScreen(true);
  }

  if (game.phase === "playing") {
    setFont(7);
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    if (game.msg) {
      ctx.fillStyle = C_MAGENTA;
      ctx.fillText(game.msg, W / 2, H - 4);
    } else if (game.carrying > 0 && [1, 3, 4].includes(game.mission)) {
      ctx.fillStyle = C_CYAN;
      ctx.fillText("← " + t("msg_return") + "  (" + game.carrying + ")", W / 2, H - 4);
    } else {
      setFont(6);
      ctx.fillStyle = C_CYAN;
      ctx.fillText(t("hud_quit_hint"), W / 2, H - 4);
    }
  }
}

function drawNameEntry() {
  const color = game.victory ? C_CYAN : C_MAGENTA;
  const cursor = (game.anim % 30) < 15 ? "_" : " ";
  const lines = [
    game.victory ? t("won_1") : t("game_over"),
    t("score_label") + "  " + pad(game.score, 6),
    "",
    t("enter_name"),
    "[ " + game.nameInput + cursor + " ]",
    "",
    t("name_help")
  ];
  if (game.posting) lines.push("", t("saving"));
  drawCenterText(lines, color);
}

function drawLeaderboardLines(maxRows) {
  const lines = [];
  if (!game.leaderboard) return lines;
  if (game.leaderboard.length === 0) {
    lines.push(t("no_scores"));
    return lines;
  }
  const n = Math.min(maxRows, game.leaderboard.length);
  for (let i = 0; i < n; i++) {
    const e = game.leaderboard[i];
    const rank = (i + 1) + ".";
    const name = (e.user || "").slice(0, 14);
    const score = pad(e.score, 6);
    lines.push(rank + " " + name + " — " + score);
  }
  return lines;
}

function drawEndScreen(victory) {
  const color = victory ? C_CYAN : C_MAGENTA;
  const head = victory
    ? [ t("won_1"), t("won_2") ]
    : [ t("game_over") ];
  const body = [
    "",
    (victory ? t("final_score") : t("score_label")) + "  " + pad(game.score, 6),
    t("hi_label") + "  " + pad(game.hi, 6),
  ];
  if (game.newRecord) body.push(t("new_record"));
  body.push("");
  body.push("— " + t("leaderboard") + " —");
  const lines = head.concat(body).concat(drawLeaderboardLines(7));
  lines.push("");
  lines.push(t("title_help_2"));
  drawCenterText(lines, color);
}

function drawTitleScreen() {
  setFont(20);
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = C_MAGENTA;
  ctx.fillText(t("title"), W / 2, 60);
  setFont(7);
  ctx.fillStyle = C_WHITE;
  ctx.fillText(t("subtitle"), W / 2, 80);

  if (game.titleView === "scores") drawTitleScores();
  else if (game.titleView === "help") drawTitleHelp();
  else drawTitleMenu();

  // Help line shared across all three views
  setFont(6);
  ctx.fillStyle = C_WHITE;
  ctx.fillText(t("title_help"), W / 2, 193);
}

function drawLegendIcon(kind, x, y) {
  // 16x11 icon slot anchored at (x, y); sprite centered at (x+8, y+6)
  const cx = x + 8;
  const cy = y + 6;
  const fy = y + 10;
  switch (kind) {
    case "heli":    drawHeli(cx, cy, 1); break;
    case "tank":    drawTank(cx, fy); break;
    case "jet":     drawJet(cx, cy, true); break;
    case "diver":   drawDiver(cx, cy, true); break;
    case "eheli":   drawEheli(cx, cy, 1, false); break;
    case "rocket":  drawRocket(cx, fy); break;
    case "spy":     drawSpy(cx, fy); break;
    case "cargo":   drawCargo(cx, fy); break;
    case "person":  drawPerson(cx, fy); break;
    case "drop":    drawDrop(cx, fy); break;
    case "fuel":    drawFuel(cx, fy); break;
    case "radar":   drawRadar(cx, fy); break;
    case "factory":
      // Compact factory glyph — full sprite is too tall for the legend.
      ctx.fillStyle = C_MAGENTA;
      ctx.fillRect(x + 3, y + 4, 10, 6);
      ctx.fillRect(x + 4, y + 2, 8, 2);
      ctx.fillRect(x + 9, y, 2, 3);
      ctx.fillStyle = C_BLACK;
      ctx.fillRect(x + 5, y + 6, 2, 2);
      ctx.fillRect(x + 9, y + 6, 2, 2);
      break;
  }
}

function drawTitleHelp() {
  setFont(8);
  ctx.fillStyle = C_CYAN;
  ctx.textAlign = "center";
  ctx.fillText("— " + t("legend") + " —", W / 2, 100);

  setFont(6);
  ctx.textAlign = "left";

  const left  = [["heli","legend_heli"],["spy","legend_spy"],["cargo","legend_cargo"],
                 ["person","legend_person"],["drop","legend_drop"],["fuel","legend_fuel"],
                 ["radar","legend_radar"]];
  const right = [["factory","legend_factory"],["tank","legend_tank"],["jet","legend_jet"],
                 ["diver","legend_diver"],["eheli","legend_eheli"],["rocket","legend_rocket"]];

  const startY = 112;
  const rowH = 11;
  for (let i = 0; i < left.length; i++) {
    const [kind, key] = left[i];
    const y = startY + i * rowH;
    drawLegendIcon(kind, 10, y);
    ctx.fillStyle = C_WHITE;
    ctx.fillText(t(key), 32, y + 8);
  }
  for (let i = 0; i < right.length; i++) {
    const [kind, key] = right[i];
    const y = startY + i * rowH;
    drawLegendIcon(kind, 162, y);
    ctx.fillStyle = C_WHITE;
    ctx.fillText(t(key), 184, y + 8);
  }
}

function drawTitleMenu() {
  setFont(8);
  ctx.fillStyle = C_CYAN;
  ctx.fillText(t("select_diff"), W / 2, 105);

  const labels = [t("diff_easy"), t("diff_normal"), t("diff_hard")];
  const baseX = 80, gap = 80;
  for (let i = 0; i < 3; i++) {
    const x = baseX + i * gap;
    const selected = i === game.diffIdx;
    ctx.fillStyle = selected ? C_MAGENTA : C_WHITE;
    setFont(selected ? 9 : 8);
    if (selected) ctx.fillText("> " + labels[i] + " <", x, 125);
    else          ctx.fillText(labels[i], x, 125);
  }
  setFont(7);
  ctx.fillStyle = C_CYAN;
  ctx.fillText(t("hud_hi") + ":" + pad(game.hi, 6), W / 2, 158);
  if (muted) {
    setFont(6);
    ctx.fillStyle = C_MAGENTA;
    ctx.fillText(t("muted_tag"), W / 2, 175);
  }
}

function drawTitleScores() {
  setFont(8);
  ctx.fillStyle = C_CYAN;
  ctx.fillText("— " + t("leaderboard") + " —", W / 2, 100);

  if (game.leaderboard == null) {
    setFont(7);
    ctx.fillStyle = C_WHITE;
    ctx.fillText(t("saving"), W / 2, 130);
    return;
  }
  if (game.leaderboard.length === 0) {
    setFont(7);
    ctx.fillStyle = C_WHITE;
    ctx.fillText(t("no_scores"), W / 2, 130);
    return;
  }
  setFont(7);
  const n = Math.min(10, game.leaderboard.length);
  for (let i = 0; i < n; i++) {
    const e = game.leaderboard[i];
    const y = 110 + i * 8;
    ctx.fillStyle = i < 3 ? C_MAGENTA : C_WHITE;
    const line = (i + 1) + ". " + (e.user || "").slice(0, 14) + " — " + pad(e.score, 6);
    ctx.fillText(line, W / 2, y);
  }
}

// --- main loop ---
let last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000;
  if (dt > 0.05) dt = 0.05;
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

// Start at the title screen with mission 1 ready in the background.
newMission(1);
game.phase = "title";
fetchLeaderboard();
requestAnimationFrame(loop);
</script>
</body>
